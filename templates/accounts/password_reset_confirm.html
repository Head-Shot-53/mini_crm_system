{% extends "base.html" %}


{% block content %}

<h1>Set new password</h1>

{% if validlink %}

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Set new password
        </button>
    </form>

{% else %}

    <p>
        This password reset link is invalid
        or has expired.
    </p>

{% endif %}

{% endblock %}
